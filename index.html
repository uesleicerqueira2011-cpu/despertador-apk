<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Calendário Despertador IA</title>
<style>
body{font-family:system-ui,sans-serif;max-width:28rem;margin:2rem auto;padding:0 1rem;line-height:1.5;background:#f7f7f8;color:#111}
a.btn,button.btn{display:inline-block;background:#111;color:#fff;padding:.9rem 1.2rem;border-radius:10px;text-decoration:none;font-weight:600;border:0;cursor:pointer;font-size:1rem}
p.note{color:#555;font-size:.95rem}
#status{margin-top:1rem;color:#333}
</style>
</head>
<body>
<h1>Calendário Despertador IA</h1>
<p>Baixe o instalador no celular e abra o arquivo para instalar.</p>
<p><button class="btn" id="dl">Baixar APK</button></p>
<p class="note">Se o Android pedir, permita instalar de fontes desconhecidas. Depois abra o app e toque em <strong>Buscar alarmes da Sofia</strong>.</p>
<p id="status"></p>
<script>
async function downloadApk(){
  const st = document.getElementById('status');
  const btn = document.getElementById('dl');
  btn.disabled = true;
  try {
    st.textContent = 'Preparando download…';
    const man = await (await fetch('/manifest.json?ts=' + Date.now())).json();
    let b64 = '';
    for (let i = 0; i < man.n; i++) {
      st.textContent = 'Baixando parte ' + (i+1) + ' de ' + man.n + '…';
      b64 += await (await fetch('/chunks/' + i + '.txt?ts=' + Date.now())).text();
    }
    st.textContent = 'Montando APK…';
    const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    const blob = new Blob([bin], {type: 'application/vnd.android.package-archive'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = man.filename || 'CalendarioDespertadorIA.apk';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    st.textContent = 'Pronto. Se o download não começou, toque de novo.';
  } catch (e) {
    st.textContent = 'Falhou: ' + e;
  } finally {
    btn.disabled = false;
  }
}
document.getElementById('dl').addEventListener('click', downloadApk);
</script>
</body>
</html>
