<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Calendário Despertador IA</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: linear-gradient(160deg, #0f172a, #1e3a5f 50%, #0ea5e9);
      color: #f8fafc;
    }
    .card {
      max-width: 420px; margin: 1.5rem; padding: 2rem;
      background: rgba(15, 23, 42, 0.85); border-radius: 1rem;
      box-shadow: 0 20px 50px rgba(0,0,0,.35); text-align: center;
    }
    h1 { font-size: 1.6rem; margin: 0 0 .75rem; }
    p { line-height: 1.5; opacity: .9; }
    a.btn, button.btn {
      display: inline-block; margin: 1.25rem 0 .75rem; padding: .9rem 1.4rem;
      background: #38bdf8; color: #0f172a; font-weight: 700; text-decoration: none;
      border-radius: .75rem; font-size: 1.05rem; border: 0; cursor: pointer;
    }
    a.btn:hover, button.btn:hover { background: #7dd3fc; }
    .tip { font-size: .9rem; opacity: .8; }
    #status { font-size: .85rem; min-height: 1.2em; opacity: .85; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Calendário Despertador IA</h1>
    <p>Baixe o APK de debug do aplicativo Android.</p>
    <a class="btn" id="direct" href="/CalendarioDespertadorIA.apk" download="CalendarioDespertadorIA.apk">Baixar APK</a>
    <p class="tip">Dica: ao instalar, permita fontes desconhecidas nas configurações do Android.</p>
    <p id="status"></p>
  </main>
</body>
</html>
